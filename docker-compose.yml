services:
  postgres:
    image: postgres:16-alpine
    container_name: simple-timesheet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet_secret
      POSTGRES_DB: timesheet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
