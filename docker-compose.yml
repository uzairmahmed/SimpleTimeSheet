version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: simple-timesheet-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: timesheet
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - timesheet-network

  mongo-express:
    image: mongo-express:latest
    container_name: simple-timesheet-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - timesheet-network

volumes:
  mongodb_data:

networks:
  timesheet-network:
    driver: bridge
